<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F1F4F1">
<title>누구 차례예요?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F4F1;
  --ink:#34465A;
  --ink-soft:#7D8A96;
  --line:#E1E6E2;
  --sky:#9CC7EA;   --sky-l:#E1EEF9;
  --peach:#F6C7AE; --peach-l:#FCE9DF;
  --sage:#AFCBB3;  --sage-l:#E3EDE4;
  --butter:#EFD9A0;--butter-l:#F8EDCF;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Gowun Dodum',sans-serif;font-size:16px;line-height:1.55}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px;border-radius:10px}

#app{max-width:480px;margin:0 auto;min-height:100%;position:relative}
.screen{display:none;min-height:100vh;min-height:100dvh}
.screen.on{display:flex;flex-direction:column}

/* 버튼 */
.jelly{
  font-family:'Jua',sans-serif;font-size:18px;color:#fff;
  padding:14px 20px;border-radius:16px;background:var(--ink);
  box-shadow:0 3px 0 #22303F;transition:transform .08s,box-shadow .08s;
}
.jelly:active{transform:translateY(3px);box-shadow:0 0 0 #22303F}
.jelly:disabled{opacity:.45;pointer-events:none}
.jelly.mint{background:var(--sky);color:var(--ink);box-shadow:0 3px 0 #7FA9CC}
.jelly.lemon{background:var(--butter);color:var(--ink);box-shadow:0 3px 0 #CDB779}
.jelly.plain{background:#fff;color:var(--ink);box-shadow:0 3px 0 var(--line);border:1.5px solid var(--line)}
.jelly.full{width:100%}
.jelly.big{font-size:20px;padding:16px 20px}
.link{color:var(--ink-soft);font-size:15px;text-decoration:underline;text-underline-offset:3px;padding:6px}
.pill{font-family:'Jua',sans-serif;font-size:15px;color:var(--ink);padding:6px 12px;border-radius:999px;background:#fff;border:1.5px solid var(--line)}

.field{width:100%;padding:13px 16px;border-radius:14px;border:1.5px solid var(--line);background:#fff;font-size:17px}
.field:focus{outline:none;border-color:var(--sky)}

/* 로고 점 */
.dots{display:inline-flex;gap:4px;vertical-align:middle}
.dots i{width:8px;height:8px;border-radius:50%;display:block}
.dots i:nth-child(1){background:var(--sky)}.dots i:nth-child(2){background:var(--peach)}
.dots i:nth-child(3){background:var(--butter)}.dots i:nth-child(4){background:var(--sage)}

/* 시작 */
#scrStart .body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:24px;padding:40px 24px 32px}
.hero{width:180px;height:180px;margin:0 auto}
.hero svg{width:100%;height:100%}
.title{font-family:'Jua',sans-serif;font-size:40px;text-align:center;line-height:1.15}
.sub{text-align:center;color:var(--ink-soft);font-size:16px}
.start-box{display:flex;flex-direction:column;gap:14px;margin-top:18px}
.or{display:flex;align-items:center;gap:10px;color:var(--ink-soft);font-size:14px}
.or::before,.or::after{content:"";flex:1;height:1.5px;background:var(--line)}
.join-row{display:flex;gap:8px;align-items:center}
.join-row .field{text-transform:uppercase;letter-spacing:4px;text-align:center;font-family:'Jua',sans-serif;font-size:20px}
.join-row .jelly{flex:none}
.msg{min-height:22px;text-align:center;font-size:14px;color:#C0504D}

/* 나는 누구? */
#scrWho .body{padding:44px 24px;display:flex;flex-direction:column;gap:22px}
.who-list{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.who-item{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px;background:#fff;border:1.5px solid var(--line);border-radius:18px}
.who-item:active{border-color:var(--ink)}
.who-item .nm{font-family:'Jua',sans-serif;font-size:15px;max-width:100%;overflow-wrap:anywhere;text-align:center;line-height:1.25}
.who-add{border-style:dashed;color:var(--ink-soft);justify-content:center;font-family:'Jua',sans-serif}
.who-add span{font-size:28px;line-height:1}

.av{display:inline-grid;place-items:center;border-radius:50%;flex:none;font-family:'Jua',sans-serif;color:var(--ink)}

/* 메인 */
#scrMain{padding-bottom:90px}
.sign-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:24px 16px 4px}
.sign{font-family:'Jua',sans-serif;font-size:23px;display:flex;align-items:center;gap:8px;white-space:nowrap;flex:none}
.snd{width:36px;height:36px;border-radius:50%;background:#fff;border:1.5px solid var(--line);font-size:17px;display:grid;place-items:center;flex:none}
.snd.off{opacity:.5}
.me-chip{display:flex;align-items:center;gap:6px;background:#fff;border:1.5px solid var(--line);padding:3px 10px 3px 3px;border-radius:999px;font-family:'Jua',sans-serif;font-size:14.5px;min-width:0}
.me-chip span:last-child{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.mode-line{margin:4px 20px 6px;font-size:13.5px;color:var(--ink-soft);display:flex;align-items:center;gap:6px}
.mode-line .dot{width:8px;height:8px;border-radius:50%;background:#E0B84F}
.mode-line.cloud .dot{background:#5FAF78}
.pane{display:none;padding:8px 20px 20px}
.pane.on{display:block}
.pane-head{display:flex;align-items:center;justify-content:space-between;margin:10px 0 12px}
.pane-head h2{font-family:'Jua',sans-serif;font-size:20px}

.items{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{
  --lid:var(--sky);--tint:var(--sky-l);
  position:relative;text-align:left;background:#fff;border:1.5px solid var(--line);
  border-radius:18px;padding:18px 14px 14px;min-height:120px;overflow:hidden;
  display:flex;flex-direction:column;gap:4px;
}
.item::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:var(--lid)}
.item:nth-child(4n+2){--lid:var(--peach);--tint:var(--peach-l)}
.item:nth-child(4n+3){--lid:var(--butter);--tint:var(--butter-l)}
.item:nth-child(4n+4){--lid:var(--sage);--tint:var(--sage-l)}
.item:active{transform:scale(.98)}
.item .ic{font-size:26px;width:44px;height:44px;border-radius:12px;background:var(--tint);display:grid;place-items:center;margin-bottom:4px}
.item .nm{font-family:'Jua',sans-serif;font-size:17px}
.item .last{font-size:12.5px;color:var(--ink-soft);display:flex;align-items:center;gap:4px;margin-top:auto;flex-wrap:wrap}
.item .del{display:none;position:absolute;top:10px;right:8px;width:28px;height:28px;border-radius:50%;background:#C0504D;color:#fff;font-size:14px;font-family:'Jua',sans-serif;z-index:2}
.editing .item .del{display:grid;place-items:center}
.editing .item{animation:wig .3s ease-in-out infinite alternate}
@keyframes wig{from{transform:rotate(-1deg)}to{transform:rotate(1deg)}}
.item.add{border-style:dashed;align-items:center;justify-content:center;color:var(--ink-soft);font-family:'Jua',sans-serif;background:transparent}
.item.add::before{display:none}
.item.add .ic{background:transparent;font-size:26px}

.live{background:#fff;border:2px solid var(--ink);border-radius:18px;padding:14px;margin-bottom:12px}
.live .lt2{font-family:'Jua',sans-serif;font-size:15px;color:var(--ink-soft);display:flex;align-items:center;gap:6px;margin-bottom:6px}
.live .now{display:flex;align-items:center;gap:8px;font-family:'Jua',sans-serif;font-size:20px;margin-bottom:10px}
.steps{display:flex;flex-direction:column;gap:6px}
.stp{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:12px;background:var(--bg);font-family:'Jua',sans-serif;font-size:15px}
.stp .no{width:24px;height:24px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:13px;flex:none}
.stp .nm2{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.stp .ck{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:#fff;display:grid;place-items:center;font-size:15px;color:transparent;flex:none}
.stp.on{opacity:.5}
.stp.on .nm2{text-decoration:line-through}
.stp.on .ck{background:var(--sage);border-color:var(--sage);color:#fff}
.stp.next{background:var(--butter-l);outline:2px solid var(--butter)}
.h-row.ord{cursor:pointer}
.h-row .arrow{font-size:13px;color:var(--ink-soft);flex:none}
.h-open{margin-top:8px}
.nav button .i{position:relative}
.nav .badge{position:absolute;top:-2px;right:-8px;width:9px;height:9px;border-radius:50%;background:#E2725B;border:2px solid #fff}
.sum-one{background:var(--butter-l);border:1.5px solid var(--butter);border-radius:999px;
  padding:9px 14px;margin-bottom:12px;font-size:14px;text-align:center}
.live{background:#fff;border:2px solid var(--ink);border-radius:18px;padding:14px;margin-bottom:12px}
.live .lt2{font-family:'Jua',sans-serif;font-size:15px;color:var(--ink-soft);display:flex;align-items:center;gap:6px;margin-bottom:6px}
.live .now{display:flex;align-items:center;gap:8px;font-family:'Jua',sans-serif;font-size:20px;margin-bottom:10px}
.steps{display:flex;flex-direction:column;gap:6px}
.stp{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:12px;background:var(--bg);font-family:'Jua',sans-serif;font-size:15px}
.stp .no{width:24px;height:24px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:13px;flex:none}
.stp .nm2{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.stp .ck{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:#fff;display:grid;place-items:center;font-size:15px;color:transparent;flex:none}
.stp.on{opacity:.5}
.stp.on .nm2{text-decoration:line-through}
.stp.on .ck{background:var(--sage);border-color:var(--sage);color:#fff}
.stp.next{background:var(--butter-l);outline:2px solid var(--butter)}
.h-row.ord{cursor:pointer}
.h-row .arrow{font-size:13px;color:var(--ink-soft);flex:none}
.h-open{margin-top:8px}
.nav button .i{position:relative}
.nav .badge{position:absolute;top:-2px;right:-8px;width:9px;height:9px;border-radius:50%;background:#E2725B;border:2px solid #fff}
.sum-one{font-size:14px;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:9px 14px;margin-bottom:12px;text-align:center}
.hist{display:flex;flex-direction:column;gap:8px}
.h-row{display:flex;align-items:center;gap:12px;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:12px}
.h-row .ic{font-size:24px;width:36px;text-align:center}
.h-main{flex:1;min-width:0}
.h-main b{font-family:'Jua',sans-serif;font-weight:400;font-size:16px}
.h-meta{font-size:12.5px;color:var(--ink-soft)}
.h-order{display:flex;gap:2px;flex-wrap:wrap;justify-content:flex-end;max-width:110px}
.h-del{width:30px;height:30px;border-radius:50%;background:var(--bg);color:var(--ink-soft);font-size:14px;font-family:'Jua',sans-serif;flex:none;display:grid;place-items:center}
.h-del:active{background:#C0504D;color:#fff}
.more-btn{width:100%;margin-top:4px;padding:12px;border-radius:14px;background:#fff;border:1.5px dashed var(--line);font-family:'Jua',sans-serif;font-size:15px;color:var(--ink-soft)}
.empty{text-align:center;color:var(--ink-soft);padding:48px 12px;display:flex;flex-direction:column;gap:14px;align-items:center}
.empty .big{font-size:40px}

.code-box{background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:18px;text-align:center;margin-bottom:18px}
.code-box .lbl{font-size:14px;color:var(--ink-soft)}
.code-box .code{font-family:'Jua',sans-serif;font-size:34px;letter-spacing:6px;margin:4px 0 10px}
.fam{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.f-row{display:flex;align-items:center;gap:12px;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:10px 12px}
.f-row .nm{font-family:'Jua',sans-serif;font-size:17px;flex:1;display:flex;align-items:center;gap:6px;min-width:0;overflow-wrap:anywhere}
.tag{font-size:12px;background:var(--sky-l);color:var(--ink);padding:1px 8px;border-radius:999px;font-family:'Gowun Dodum',sans-serif;flex:none}
.f-row .cnt{font-size:13px;color:var(--ink-soft);flex:none}
.f-row .edit{font-size:17px;padding:6px}
.fam-actions{display:flex;flex-direction:column;gap:6px;align-items:center;margin-top:10px}

.nav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:5;
  display:flex;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-top:1.5px solid var(--line);
  padding:6px 10px calc(8px + env(safe-area-inset-bottom));
}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;padding:6px 0;border-radius:12px;font-family:'Jua',sans-serif;font-size:13.5px;color:var(--ink-soft)}
.nav button .i{font-size:21px;filter:grayscale(1);opacity:.5}
.nav button.on{color:var(--ink);background:var(--bg)}
.nav button.on .i{filter:none;opacity:1}

/* 뽑기 화면 */
#scrDraw .body{padding:22px 20px 28px;display:flex;flex-direction:column;gap:16px;flex:1}
.draw-top{display:flex;align-items:center;gap:10px}
.back{width:42px;height:42px;border-radius:50%;background:#fff;border:1.5px solid var(--line);font-size:19px;display:grid;place-items:center;flex:none}
.draw-top h2{font-family:'Jua',sans-serif;font-size:23px;display:flex;align-items:center;gap:8px}
.sec-label{font-family:'Jua',sans-serif;font-size:16px;margin-bottom:8px}
.sec-label small{font-family:'Gowun Dodum',sans-serif;font-size:13px;color:var(--ink-soft);margin-left:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:6px;padding:3px 12px 3px 3px;border-radius:999px;background:#fff;border:1.5px solid var(--line);font-family:'Jua',sans-serif;font-size:15px;opacity:.45}
.chip.on{opacity:1;border-color:var(--ink)}

.seg{display:flex;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:4px;gap:4px}
.seg button{flex:1;padding:10px 0;border-radius:12px;font-family:'Jua',sans-serif;font-size:16px;color:var(--ink-soft)}
.seg button.on{background:var(--ink);color:#fff}

.games{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.game{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 4px 10px;background:#fff;border:1.5px solid var(--line);border-radius:16px;position:relative}
.game .gi{font-size:28px;line-height:1.25}
.game .gn{font-family:'Jua',sans-serif;font-size:14.5px}
.game .gt{font-size:11.5px;padding:0 8px;border-radius:999px;background:var(--sage-l);color:#3D6147}
.game .gt.half{background:var(--butter-l);color:#7A5E1A}
.game .gt.skill{background:var(--sky-l);color:#2E5A82}
.game.on{border:2px solid var(--ink);background:#FAFBFA}
.game.on::after{content:"✓";position:absolute;top:-8px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;font-family:'Jua',sans-serif;font-size:13px;display:grid;place-items:center}
.game.soon{opacity:.45;border-style:dashed;background:transparent}
.game.soon .gt{background:#EAECEA;color:var(--ink-soft)}

.play{display:flex;flex-direction:column;gap:12px;flex:1}
.play-top{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:6px 8px}
.play-top .who-strip{display:flex;gap:3px;flex-wrap:wrap;flex:1;min-width:0;align-items:center}
.play-top .cfg{display:flex;align-items:center;gap:4px;font-family:'Jua',sans-serif;font-size:12.5px;color:var(--ink-soft);background:var(--bg);border-radius:999px;padding:5px 10px;flex:none;max-width:56%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.item .recent{position:absolute;top:10px;right:10px;font-size:11px;font-family:'Jua',sans-serif;color:var(--ink);background:var(--lid);border-radius:999px;padding:1px 8px}
.item.fresh{border-color:var(--lid)}
.item .tagline{font-size:11.5px;color:var(--ink);background:var(--tint);border-radius:999px;padding:1px 8px;align-self:flex-start;margin-top:2px}
.hint{text-align:center;font-family:'Jua',sans-serif;font-size:19px;min-height:30px}
.game-area{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:300px}
.draw-btns{display:flex;gap:10px;flex-wrap:wrap}
.draw-btns .jelly{flex:1;min-width:120px}

/* 카드 */
.stage{display:grid;gap:12px;justify-content:center;width:100%}
.card{perspective:900px;aspect-ratio:3/4;width:100%;position:relative}
.card.moving{animation:gather .95s cubic-bezier(.5,0,.3,1) both}
@keyframes gather{0%{transform:none}35%,55%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(.9)}100%{transform:none}}
.card.pickable{cursor:pointer}
.card.pickable .inner{animation:bob 1.6s ease-in-out infinite;animation-delay:var(--delay)}
@keyframes bob{50%{transform:translateY(-4px)}}
.inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,1.3,.5,1)}
.card.flipped .inner{transform:rotateY(180deg);animation:none}
.face{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:4px solid #fff;box-shadow:0 4px 12px rgba(52,70,90,.14);overflow:hidden}
.back-face{
  background-color:var(--sky);
  background-image:
    linear-gradient(45deg,rgba(255,255,255,.28) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.28) 75%),
    linear-gradient(45deg,rgba(255,255,255,.28) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.28) 75%);
  background-size:16px 16px;background-position:0 0,8px 8px;
}
.back-face::after{
  content:"?";position:absolute;left:50%;top:50%;width:46%;aspect-ratio:1;transform:translate(-50%,-50%);
  border-radius:50%;background:#fff;display:grid;place-items:center;
  font-family:'Jua',sans-serif;font-size:clamp(20px,6.5vw,30px);color:var(--ink);
}
.front{transform:rotateY(180deg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:'Jua',sans-serif;text-align:center;padding:6px}
.front .fi{width:clamp(40px,13vw,64px);height:clamp(40px,13vw,64px);border-radius:50%;background:rgba(255,255,255,.7);display:grid;place-items:center;font-size:clamp(20px,7.5vw,32px)}
.front .fn{font-size:clamp(13px,4vw,18px);word-break:keep-all;overflow-wrap:anywhere;line-height:1.2}
.front .rk{position:absolute;top:6px;left:6px;font-size:12.5px;background:#fff;border-radius:999px;padding:0 8px;color:var(--ink)}
.card.dim .inner{transform:rotateY(180deg) scale(.92)}
.card.dim .front{opacity:.5;filter:saturate(.4)}
.card.win{z-index:2}
.card.win .inner{transform:rotateY(180deg) scale(1.08)}

/* 사다리 */
.ladder{width:100%;max-width:380px}
.l-row{position:relative;height:66px}
.l-top .lt{position:absolute;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:2px;font-family:'Jua',sans-serif;font-size:12px;width:52px}
.l-top .lt .n{max-width:52px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.l-top .lt.done{opacity:.55}
.l-top .lt.empty{gap:3px}
.l-top .lt.empty .slot{width:34px;height:34px;border-radius:50%;background:#fff;border:2px dashed var(--sky);color:var(--sky);display:grid;place-items:center;font-size:15px}
.l-top .lt.empty:active .slot{background:var(--sky-l)}
.l-top .lt.empty .n{color:var(--ink-soft)}
.l-top .lt.go .av{animation:hop .5s ease-in-out infinite alternate}
@keyframes hop{to{transform:translateY(-4px)}}
.l-bot .lb{
  position:absolute;top:6px;transform:translateX(-50%);min-width:40px;height:40px;padding:0 6px;border-radius:12px;
  display:grid;place-items:center;font-family:'Jua',sans-serif;font-size:14px;color:transparent;white-space:nowrap;
  background:var(--sage-l);border:1.5px solid var(--sage);
}
.l-bot .lb::after{content:"?";color:#3D6147;position:absolute}
.l-bot .lb.open{background:#fff;color:var(--ink);border-color:var(--line);animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
.l-bot .lb.open::after{content:none}
.l-bot .lb.open.win{background:var(--butter);border-color:var(--butter)}
@keyframes pop{0%{transform:translateX(-50%) scale(.5)}100%{transform:translateX(-50%) scale(1)}}
.ladder svg{width:100%;height:auto;display:block}
.l-cover{transition:opacity .6s}
.l-path{fill:none;stroke-linecap:round;stroke-linejoin:round}

/* 돌림판 */
.wheel-wrap{position:relative;width:min(300px,80vw);aspect-ratio:1;margin:8px auto 0}
.wheel{width:100%;height:100%;transition:transform 4.3s cubic-bezier(.12,.62,.08,1);will-change:transform}
.wheel.no-anim{transition:none!important}
.wheel svg{width:100%;height:100%;display:block}
.pointer{pointer-events:none;position:absolute;top:-16px;left:50%;width:36px;margin-left:-18px;z-index:2;transform-origin:50% 20%}
.pointer.tick{animation:tk .12s}
@keyframes tk{50%{transform:rotate(-12deg)}}
.hub{position:absolute;left:34%;top:34%;width:32%;height:32%;border-radius:50%;background:#fff;border:2px solid var(--line);
  display:grid;place-items:center;text-align:center;line-height:1.15;font-family:'Jua',sans-serif;font-size:clamp(15px,4.6vw,19px);
  color:var(--ink);z-index:2;pointer-events:none;transition:opacity .3s}
.hub small{font-size:.62em;color:var(--ink-soft)}
.hub.off{opacity:0}
.wheel-wrap{touch-action:none;cursor:grab}
.wheel-wrap.grab{cursor:grabbing}
.bulb{fill:#fff}
.bulb.alt{fill:var(--butter)}
.spinning .bulb{animation:blink .25s steps(1) infinite}
.spinning .bulb.alt{animation-delay:.125s}
@keyframes blink{50%{fill:var(--sky)}}
.ranks-mini{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:14px;min-height:34px}
.ranks-mini span{display:flex;align-items:center;gap:4px;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:2px 10px 2px 2px;font-family:'Jua',sans-serif;font-size:14px}

/* 지뢰 상자 */
.mine-turn{display:flex;align-items:center;justify-content:center;gap:8px;font-family:'Jua',sans-serif;font-size:18px;margin-bottom:10px;min-height:44px}
.mine-turn .who{display:flex;align-items:center;gap:6px;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:3px 14px 3px 3px;max-width:60vw}
.mine-turn .who span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.mine-wrap{width:100%;display:flex;flex-direction:column;align-items:center;gap:10px}
.mine-grid{display:grid;gap:6px;width:100%;max-width:340px}
.box{
  aspect-ratio:1;border-radius:12px;background:var(--butter-l);border:1.5px solid var(--butter);
  display:grid;place-items:center;font-size:clamp(15px,5vw,24px);font-family:'Jua',sans-serif;color:var(--ink);
  transition:transform .1s;
}
.box:active{transform:scale(.9)}
.box.open{background:#F7F8F7;border-color:var(--line);border-style:dashed;color:var(--ink-soft);animation:pop .3s cubic-bezier(.3,1.6,.5,1);pointer-events:none}
.box.open.num{background:var(--sky-l);border-color:var(--sky);border-style:solid;color:var(--ink);font-size:clamp(14px,4.4vw,20px)}
.box.boom{background:#C0504D;border-color:#C0504D;animation:shake .45s}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-4px,2px) rotate(-3deg)}40%{transform:translate(4px,-2px) rotate(3deg)}60%{transform:translate(-3px,1px)}80%{transform:translate(3px,-1px)}}
.mine-bar{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.mine-bar span{display:flex;align-items:center;gap:4px;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:2px 10px 2px 2px;font-family:'Jua',sans-serif;font-size:13.5px;max-width:130px}
.mine-bar span b{font-weight:400;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.mine-bar span.out{opacity:.4;text-decoration:line-through}
.mine-info{font-size:13.5px;color:var(--ink-soft)}

.bal-wrap{width:100%;display:flex;flex-direction:column;align-items:center;gap:10px}
.bal-stage{height:264px;display:flex;align-items:flex-end;justify-content:center;width:100%;overflow:visible}
.bal{transform-origin:50% 92%;transition:transform .06s linear}
.bal.holding{animation:balWob .5s ease-in-out infinite alternate}
@keyframes balWob{to{filter:brightness(1.04)}}
.bal.pop{animation:balPop .35s forwards}
@keyframes balPop{0%{transform:scale(var(--s))}40%{transform:scale(calc(var(--s) * 1.35))}100%{transform:scale(calc(var(--s) * 1.5));opacity:0}}
.bal-btn{width:100%;max-width:320px;user-select:none;touch-action:none}
.bal-btn.holding{transform:translateY(3px);box-shadow:0 0 0 #22303F}
.bal-turn{display:flex;align-items:center;gap:8px;font-family:'Jua',sans-serif;font-size:19px;min-height:42px}
.bal-turn .who{display:flex;align-items:center;gap:6px;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:3px 14px 3px 3px;max-width:60vw}
.bal-turn .who span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.bal-queue{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.bal-queue span{display:flex;align-items:center;gap:4px;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:2px 10px 2px 2px;font-family:'Jua',sans-serif;font-size:13px;max-width:120px}
.bal-queue span.out{opacity:.4;text-decoration:line-through}
.bal-queue span.now{border-color:var(--ink)}

/* 결과 파티 */
.result{display:none;flex-direction:column;align-items:center;gap:6px;text-align:center}
.result.on{display:flex}
.party-av{animation:partyPop .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes partyPop{0%{transform:scale(.3)}100%{transform:none}}
.party-t{font-family:'Jua',sans-serif;font-size:28px}
.face-wrap{position:relative;display:inline-block}
.face-bubble{position:absolute;right:-6px;bottom:-4px;font-size:30px;animation:bubblePop .5s cubic-bezier(.3,1.7,.5,1) .35s both}
.face-bubble.sm{font-size:16px;right:-3px;bottom:-2px}
@keyframes bubblePop{0%{transform:scale(0) rotate(-40deg)}100%{transform:none}}
.say{font-family:'Jua',sans-serif;font-size:17px;color:var(--ink-soft)}
.others{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.others .o{display:flex;align-items:center;gap:4px;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:3px 10px 3px 3px;font-family:'Jua',sans-serif;font-size:13.5px;max-width:140px}
.others .o b{font-weight:400;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.fact{font-size:13.5px;color:var(--ink);background:var(--butter-l);border:1.5px solid var(--butter);border-radius:999px;padding:4px 12px;margin-top:8px;max-width:100%}
.rank-list{list-style:none;display:flex;flex-direction:column;gap:8px;width:100%;margin-top:4px}
.rank-list li{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:8px 12px;font-family:'Jua',sans-serif;font-size:17px;animation:slideIn .35s both}
.rank-list li .no{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:15px;background:var(--bg);color:var(--ink);flex:none}
.rank-list li:first-child{border-color:var(--butter);background:#FFFCF3}
.rank-list li:first-child .no{background:var(--butter)}
@keyframes slideIn{from{opacity:0;transform:translateY(8px)}}

/* 모달 */
.modal{position:fixed;inset:0;background:rgba(52,70,90,.35);display:none;align-items:flex-end;justify-content:center;z-index:50}
.modal.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:up .28s cubic-bezier(.3,1.2,.5,1)}
@keyframes up{from{transform:translateY(40%);opacity:0}}
.sheet h3{font-family:'Jua',sans-serif;font-size:21px;margin-bottom:14px}
.preview{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:14px}
.preview .pn{font-family:'Jua',sans-serif;font-size:18px;min-height:27px}
.count{text-align:right;font-size:12.5px;color:var(--ink-soft);margin-top:4px}
.tabs{display:flex;gap:6px;margin:12px 0 10px}
.tabs button{flex:1;padding:8px 0;border-radius:12px;background:#fff;border:1.5px solid var(--line);font-family:'Jua',sans-serif;font-size:15px}
.tabs button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.grid-pick{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.grid-pick button{aspect-ratio:1;font-size:25px;border-radius:12px;background:#fff;border:1.5px solid var(--line)}
.grid-pick button.on{border:2px solid var(--ink);background:var(--sky-l)}
.sugs{display:flex;flex-wrap:wrap;gap:6px}
.sugs button{display:flex;align-items:center;gap:4px;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13.5px;font-family:'Jua',sans-serif}
.sugs button:active{border-color:var(--ink);background:var(--sky-l)}
.simple-note{grid-column:1/-1;font-size:14px;color:var(--ink-soft);padding:10px 2px}
.colors{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 18px}
.colors button{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--line)}
.colors button.on{box-shadow:0 0 0 2.5px var(--ink)}
.label{font-size:14px;color:var(--ink-soft);margin:6px 0 6px}
.sheet-btns{display:flex;gap:10px;margin-top:10px}
.sheet-btns .jelly{flex:1;padding-left:10px;padding-right:10px}
.confirm-text{margin-bottom:18px;font-size:17px}

.intro{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:10px 4px 4px}
.intro .big{font-size:56px;line-height:1.1}
.intro h4{font-family:'Jua',sans-serif;font-size:21px;font-weight:400}
.intro p{font-size:15px;color:var(--ink-soft);line-height:1.5}
.dotsrow{display:flex;justify-content:center;gap:7px;margin:14px 0 2px}
.dotsrow i{width:8px;height:8px;border-radius:50%;background:var(--line);display:block;transition:all .2s}
.dotsrow i.on{background:var(--ink);width:20px;border-radius:999px}
#toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-160%);z-index:60;background:var(--ink);color:#fff;padding:12px 18px;border-radius:999px;font-size:15px;transition:transform .35s cubic-bezier(.3,1.3,.5,1);max-width:92%;text-align:center;visibility:hidden}
#toast.on{transform:translate(-50%,0);visibility:visible}

.confetti{position:fixed;top:-20px;z-index:40;pointer-events:none;animation:fall linear forwards}
.confetti.bit{width:8px;height:12px;border-radius:2px}
.confetti.dot{width:9px;height:9px;border-radius:50%}
@keyframes fall{to{transform:translate(var(--x),110vh) rotate(var(--r))}}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div id="app">

  <!-- 시작 -->

  <!-- 나는 누구? -->

  <!-- 메인 -->
  <section id="scrMain" class="screen">

    <nav class="nav">

<script>
/* =========================================================
   ☁️ Firebase 설정
   각자 폰에서 같이 쓰려면 여기에 Firebase 설정을 붙여넣어요.
   비워두면(null) "혼자 테스트 모드"로 이 기기에만 저장돼요.
   ========================================================= */
const FIREBASE_CONFIG = null;

/* ---------- 데이터 ---------- */
const SETS = {
  animal:['🐰','🐱','🐶','🐻','🐼','🦊','🐹','🐨','🐯','🐸','🐧','🐥'],
  snack: ['🍩','🍪','🧁','🍰','🍭','🍫','🍿','🍦','🥨','🍮','🍬','🥞'],
  fruit: ['🍓','🍑','🍋','🍇','🍉','🍒','🥝','🍍','🍎','🍊','🍐','🫐'],
};
const COLORS = ['#C4DDF3','#F8D3C0','#F3E3A8','#C8DDCB','#D6D0F0','#F2CBD0','#BFE3E0','#E6D8C6'];
const ICONS = ['📺','🚗','🛁','🍪','🧽','🎮','🛋️','🍕','🐶','🗑️','🚿','🎤','🍦','📱','🧸','🎲','🛝','🍗','😂','💃','📸','🙆','🧹','🍀'];
const DEFAULT_ITEMS = [
  {icon:'📺',name:'리모컨',kind:'good'},
  {icon:'🍪',name:'마지막 간식',kind:'good'},
  {icon:'🚗',name:'차 앞자리',kind:'good'},
  {icon:'🎤',name:'노래 한 곡',kind:'chore'},
  {icon:'🧽',name:'설거지 돕기',kind:'chore'},
  {icon:'😂',name:'오늘 웃긴 사람',kind:'good'},
];
// 이름만 보고 좋은 일인지 해야 할 일인지 짐작해요
const CHORE_WORDS=['설거지','청소','쓰레기','치우','빨래','심부름','정리','버리','닦','돕기','안마','산책','씻','정돈','빨기','분리수거'];
function guessKind(name){
  const n=nfc(name);
  return CHORE_WORDS.some(w=>n.includes(w)) ? 'chore' : 'good';
}
const kindOf=it=>it.kind||guessKind(it.name);

const $ = id => document.getElementById(id);
const memStore = {};
const LS = {
  get(k){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):(memStore[k]??null); }catch(e){ return memStore[k]??null; } },
  set(k,v){ memStore[k]=v; try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} },
};
function rnd(n){ try{ const a=new Uint32Array(1); crypto.getRandomValues(a); return a[0]%n; }catch(e){ return Math.floor(Math.random()*n); } }
function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=rnd(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function uid(){ return Date.now().toString(36)+rnd(1e6).toString(36); }
function newCode(){ const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s=''; for(let i=0;i<6;i++) s+=c[rnd(c.length)]; return s; }
function nfc(t){ try{ return String(t??'').normalize('NFC'); }catch(e){ return String(t??''); } }
function esc(s){ s=nfc(s); return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function faceOf(m){ return m.emoji ? m.emoji : esc((m.name||'?').slice(0,1)); }
function avatar(m,size=40){
  if(!m) return `<span class="av" style="width:${size}px;height:${size}px;background:#eee">?</span>`;
  const fs = m.emoji ? size*.58 : size*.46;
  return `<span class="av" style="width:${size}px;height:${size}px;background:${m.color};font-size:${fs}px">${faceOf(m)}</span>`;
}
function timeText(t){
  const d=new Date(t), now=new Date();
  const hm=d.toLocaleTimeString('ko-KR',{hour:'numeric',minute:'2-digit'});
  if(d.toDateString()===now.toDateString()) return '오늘 '+hm;
  const y=new Date(now); y.setDate(now.getDate()-1);
  if(d.toDateString()===y.toDateString()) return '어제 '+hm;
  return `${d.getMonth()+1}월 ${d.getDate()}일 ${hm}`;
}
let toastTimer;
function toast(msg){ const t=$('toast'); t.innerHTML=msg; t.classList.add('on'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('on'),2800); }
function askConfirm(text){
  return new Promise(res=>{
    $('confirmText').textContent=text; $('mConfirm').classList.add('on');
    const done=v=>{ $('mConfirm').classList.remove('on'); $('cYes').onclick=$('cNo').onclick=null; res(v); };
    $('cYes').onclick=()=>done(true); $('cNo').onclick=()=>done(false);
  });
}
function loadScript(src){ return new Promise((ok,no)=>{ const s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=no; document.head.appendChild(s); }); }
const wait = ms => new Promise(r=>setTimeout(r,ms));

/* =========================================================
   저장소
   ========================================================= */
let fam={members:{},items:{},history:{}};
const Store={
  mode:'local', code:null, ref:null, db:null,
  async init(){
    if(!FIREBASE_CONFIG) return;
    try{
      await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js');
      await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js');
      firebase.initializeApp(FIREBASE_CONFIG);
      this.db=firebase.database(); this.mode='cloud';
    }catch(e){ console.warn('Firebase 연결 실패, 테스트 모드로 실행',e); this.mode='local'; }
  },
  async exists(code){
    if(this.mode==='cloud'){ const s=await this.db.ref('families/'+code+'/createdAt').once('value'); return s.exists(); }
    return !!LS.get('fam_'+code);
  },
  async create(code){
    const items={};
    DEFAULT_ITEMS.forEach((it,i)=>{ const id='i'+i+uid(); items[id]={...it,id,order:i}; });
    const data={createdAt:Date.now(),members:{},items,history:{}};
    if(this.mode==='cloud') await this.db.ref('families/'+code).set(data);
    else LS.set('fam_'+code,data);
  },
  connect(code,onChange){
    this.code=code;
    if(this.ref){ this.ref.off(); this.ref=null; }
    if(this.mode==='cloud'){
      this.ref=this.db.ref('families/'+code);
      return new Promise(res=>{
        let first=true;
        this.ref.on('value',snap=>{ fam=normalize(snap.val()); onChange(first); if(first){ first=false; res(); } });
      });
    }
    fam=normalize(LS.get('fam_'+code)); onChange(true);
    return Promise.resolve();
  },
  _saveLocal(){ LS.set('fam_'+this.code,fam); render(); },
  setMember(m){ if(this.mode==='cloud') return this.ref.child('members/'+m.id).set(m); fam.members[m.id]=m; this._saveLocal(); },
  removeMember(id){ if(this.mode==='cloud') return this.ref.child('members/'+id).remove(); delete fam.members[id]; this._saveLocal(); },
  setItem(it){ if(this.mode==='cloud') return this.ref.child('items/'+it.id).set(it); fam.items[it.id]=it; this._saveLocal(); },
  removeItem(id){ if(this.mode==='cloud') return this.ref.child('items/'+id).remove(); delete fam.items[id]; this._saveLocal(); },
  addHistory(h){
    const keys=Object.keys(fam.history).sort((a,b)=>fam.history[a].t-fam.history[b].t);
    const extra=keys.slice(0,Math.max(0,keys.length-59));
    if(this.mode==='cloud'){ this.ref.child('history').push(h); extra.forEach(k=>this.ref.child('history/'+k).remove()); return; }
    extra.forEach(k=>delete fam.history[k]);
    fam.history[uid()]=h; this._saveLocal();
  },
  setDone(k,list){
    if(this.mode==='cloud') return this.ref.child('history/'+k+'/done').set(list);
    if(fam.history[k]) fam.history[k].done=list;
    this._saveLocal();
  },
  removeHistory(k){ if(this.mode==='cloud') return this.ref.child('history/'+k).remove(); delete fam.history[k]; this._saveLocal(); },
  clearHistory(){ if(this.mode==='cloud') return this.ref.child('history').remove(); fam.history={}; this._saveLocal(); }
};
function normalize(v){
  v=v||{};
  const out={createdAt:v.createdAt||0,members:v.members||{},items:v.items||{},history:v.history||{}};
  // 예전에 쪼개진 채로 저장된 한글 이름을 합쳐요
  Object.values(out.members).forEach(m=>{ if(m&&m.name) m.name=nfc(m.name); });
  Object.values(out.items).forEach(i=>{ if(i&&i.name) i.name=nfc(i.name); });
  return out;
}

function usedMap(){ const u={}; allHist().forEach(h=>{ if(!(h.item in u)) u[h.item]=h.t; }); return u; }

const HIST_PAGE=10;
let histLimit=HIST_PAGE;
function renderSum(){
  const week=Date.now()-7*24*3600*1000;
  const pickOf=x=> x.mode==='order' ? toArr(x.order)[0] : x.winner;
  const all=allHist().filter(x=>x.t>=week && pickOf(x));
  const box=$('histSum');
  if(all.length<2){ box.innerHTML=''; return; }
  // 할 일과 좋은 거는 따로 세요
  const cnt={good:{},chore:{}};
  all.forEach(x=>{
    const it=fam.items[x.item]; const k=it?kindOf(it):'good';
    const id=pickOf(x); cnt[k][id]=(cnt[k][id]||0)+1;
  });
  const topOf=k=>{
    const rows=Object.entries(cnt[k]).map(([id,c])=>({m:fam.members[id],c})).filter(r=>r.m).sort((a,b)=>b.c-a.c);
    return rows.length && rows[0].c>=2 && (rows.length<2||rows[0].c>rows[1].c) ? rows[0] : null;
  };
  const chore=topOf('chore'), good=topOf('good');
  let line=`🎲 이번 주에 ${all.length}번 정했어요`;
  if(chore) line=`🧹 이번 주엔 ${esc(chore.m.name)}님이 할 일에 ${chore.c}번 걸렸어요`;
  else if(good) line=`🎁 이번 주엔 ${esc(good.m.name)}님이 ${good.c}번 당첨됐어요`;
  box.innerHTML=`<div class="sum-one">${line}</div>`;
}
function doneOf(h){ return toArr(h.done); }
function orderMembers(h){ return toArr(h.order).map(id=>fam.members[id]); }
function isLive(h){
  if(h.mode!=='order') return false;
  const ids=toArr(h.order).filter(id=>fam.members[id]);
  return ids.length>0 && doneOf(h).length < ids.length;
}
function liveOne(){
  const day=Date.now()-24*3600*1000;
  return allHist().find(h=>h.t>=day && isLive(h));
}
function toggleDone(h,id){
  const ids=toArr(h.order);
  let d=doneOf(h);
  d = d.includes(id) ? d.filter(x=>x!==id) : d.concat([id]);
  // 앞사람부터 순서대로만 끝낼 수 있게 정리해요
  d = ids.filter(x=>d.includes(x));
  Store.setDone(h._k, d);
  const live=ids.filter(x=>fam.members[x]);
  if(d.length>=live.length){
    toast('🎉 끝까지 다 했어요! 수고했어요');
    playSound('party');
  }
}
function stepsHTML(h){
  const d=doneOf(h);
  const ms=orderMembers(h);
  const nextIdx=ms.findIndex((m,i)=>m && !d.includes(toArr(h.order)[i]));
  return `<div class="steps">${ms.map((m,i)=>{
    const id=toArr(h.order)[i], on=d.includes(id);
    return `<div class="stp ${on?'on':''} ${i===nextIdx?'next':''}">
      <span class="no">${i+1}</span>${avatar(m,26)}
      <span class="nm2">${m?esc(m.name):'(나간 가족)'}</span>
      <button class="ck" data-ck="${h._k}|${id}" aria-label="끝났어요">✓</button></div>`;
  }).join('')}</div>`;
}
function bindChecks(root){
  root.querySelectorAll('[data-ck]').forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const [k,id]=b.dataset.ck.split('|');
    const h=allHist().find(x=>x._k===k);
    if(h) toggleDone(h,id);
  });
}
function renderLive(){
  const box=$('histLive');
  const h=liveOne();
  document.querySelector('.nav button[data-pane="paneHist"] .i').innerHTML =
    '📒' + (h?'<span class="badge"></span>':'');
  if(!h){ box.innerHTML=''; return; }
  const d=doneOf(h), ids=toArr(h.order);
  const nextId=ids.find(id=>!d.includes(id));
  const nm=fam.members[nextId];
  box.innerHTML=`<div class="live">
    <div class="lt2">${esc(h.icon)} ${esc(h.name)} 순서 진행 중</div>
    <div class="now">${avatar(nm,36)}${nm?esc(nm.name):'(나간 가족)'}님 차례예요</div>
    ${stepsHTML(h)}</div>`;
  bindChecks(box);
}
let openRow=null;
function renderHist(){
  renderLive(); renderSum();
  const list=allHist();
  $('btnClearHist').style.display=list.length?'':'none';
  if(!list.length){ $('histList').innerHTML=`<div class="empty"><span class="big">📒</span>아직 기록이 없어요.<br>첫 번째 게임을 해볼까요?</div>`; return; }
  const shown=list.slice(0,histLimit);
  $('histList').innerHTML=shown.map(h=>{
    const b=fam.members[h.by];
    const meta=`${timeText(h.t)}, ${GAME_ICON[h.game||'card']||'🃏'}${b?` ${esc(b.name)}님이 했어요`:''}`;
    const del=`<button class="h-del" data-hdel="${h._k}" aria-label="이 기록 지우기">✕</button>`;
    if(h.mode==='order'){
      const ms=orderMembers(h), f=ms[0];
      const d=doneOf(h).length;
      const open=openRow===h._k;
      return `<div><div class="h-row ord" data-row="${h._k}"><span class="ic">${esc(h.icon)}</span>
        <div class="h-main"><b>${esc(h.name)}: ${f?esc(f.name):'(나간 가족)'}님이 1번째</b>
          <div class="h-meta">${meta}${ms.length>1?`, 외 ${ms.length-1}명`:''}${d?` · ${d}명 끝`:''}</div></div>
        <span class="arrow">${open?'▲':'▼'}</span>${del}</div>
        ${open?`<div class="h-open">${stepsHTML(h)}</div>`:''}</div>`;
    }
    const w=fam.members[h.winner];
    return `<div class="h-row"><span class="ic">${esc(h.icon)}</span>
      <div class="h-main"><b>${esc(h.name)}: ${w?esc(w.name):'(나간 가족)'} 차례</b><div class="h-meta">${meta}</div></div>

function finish(res,tok){
  if(!D || D.token!==tok) return;
  const h={item:D.item.id,name:D.item.name,icon:D.item.icon,game:D.game,mode:D.mode,by:me.memberId||null,t:Date.now()};
  const r=$('result');
  const kind = kindOf(D.item);
  const SAD=['😭','😱','😵‍💫','🥲','😮‍💨'], GLAD=['😄','😌','🙌','😁','😎'];
  const pick=a=>a[rnd(a.length)];
  const LOSE=['아이고...','왜 하필 저예요!','이럴 수가...','앗, 걸렸다!','운명이네요...'];
  const YAY =['신난다!','제가 됐어요!','와, 최고!','오늘 운이 좋아요!','앗싸!'];
  const WIN =['신난다!','제가 1등이에요!','와, 최고!','기분 좋아요!'];
  const good = kind==='good';

  if(D.mode==='order'){
    h.order=res.order.map(m=>m.id);
    const f=res.order[0], last=res.order[res.order.length-1];
    r.innerHTML=`
      <div class="face-wrap party-av">${avatar(f,84)}<span class="face-bubble">${pick(GLAD)}</span></div>
      <div class="party-t">🎉 ${esc(f.name)}님이 1번째!</div>
      <div class="say">"${pick(WIN)}"</div>
      <ol class="rank-list">${res.order.map((m,i)=>`<li style="animation-delay:${i*.12}s"><span class="no">${i+1}</span>${avatar(m,34)}${esc(m.name)}${i===0?' 👑':(m===last?' 😅':'')}</li>`).join('')}</ol>`;
    confetti(f.color);
    playSound('party');
  }else{
    h.winner=res.winner.id;
    const w=res.winner;
    const others=(res.others||[]).filter(m=>m.id!==w.id);
    r.innerHTML=`
      <div class="face-wrap party-av">${avatar(w,92)}<span class="face-bubble">${good?pick(GLAD):pick(SAD)}</span></div>
      <div class="party-t">${good?'🎉':'💥'} ${esc(w.name)} ${good?'당첨!':'차례!'}</div>
      <div class="say">"${good?pick(YAY):pick(LOSE)}"</div>
      ${others.length?`<div class="others">${others.map(m=>`<span class="o"><span class="face-wrap">${avatar(m,24)}<span class="face-bubble sm">${good?pick(SAD):pick(GLAD)}</span></span><b>${esc(m.name)}</b></span>`).join('')}</div>`:''}`;
    confetti(w.color);
    playSound(good?'party':'oops');
  }
  const fact=funFact(D.mode==='order'?res.order[0]:res.winner, D.mode);
  if(fact) r.insertAdjacentHTML('beforeend',`<div class="fact">${fact}</div>`);
  r.classList.add('on');

    <button class="jelly plain" id="btnAgain">다시 하기</button>

}

/* 기록을 보고 한마디 만들어 주기 */
function funFact(m,mode){
  if(!m || mode==='order') return '';
  const good = D && kindOf(D.item)==='good';
  const hist=allHist().filter(x=>x.mode!=='order');
  let streak=0;
  for(const x of hist){ if(x.winner===m.id) streak++; else break; }
  if(streak>=3) return good?`🍀 ${esc(m.name)}님, ${streak}번 연속 당첨이에요!`:`😵 ${esc(m.name)}님, ${streak}번 연속이에요!`;
  if(streak===2) return good?`✨ ${esc(m.name)}님, 두 번 연속 당첨!`:`😮 ${esc(m.name)}님, 두 번 연속이에요!`;
  const week=Date.now()-7*24*3600*1000;
  const cnt=hist.filter(x=>x.winner===m.id && x.t>=week).length;
  if(cnt>=4) return good?`🔥 이번 주에 벌써 ${cnt}번이나 됐어요!`:`🔥 이번 주에 벌써 ${cnt}번째예요!`;
  const idx=hist.findIndex((x,i)=>i>0 && x.winner===m.id);
  if(idx>=6) return `😲 ${esc(m.name)}님은 ${idx}번 만에 걸렸어요!`;
  return '';
}

function gameCard(ctx){
  const {list,mode}=ctx;
  const n=list.length;
  const cols=n<=3?n:n===4?2:n<=6?3:4;
  const maxW=n<=4?128:n<=6?108:88;
  const area=$('gameArea');
  area.innerHTML=`<div class="stage" id="stage" style="grid-template-columns:repeat(${cols},minmax(0,${maxW}px))"></div>`;
  const stage=$('stage');
  const cardHTML=(i,m)=>`<div class="card" data-i="${i}" style="--delay:${i*.12}s"><div class="inner">
      <div class="face back-face"></div>
      <div class="face front" style="background:${m?m.color:'#fff'}">${m?`<span class="rk"></span><span class="fi">${faceOf(m)}</span><span class="fn">${esc(m.name)}</span>`:''}</div>
    </div></div>`;
  stage.innerHTML=list.map((_,i)=>cardHTML(i,null)).join('');
  ctx.hint('카드를 섞어볼까요?');
  ctx.buttons(`<button class="jelly full big" id="btnShuffle">🃏 카드 섞기</button>`);
  $('btnShuffle').onclick=()=>{
    const deal=shuffle(list);
    stage.innerHTML=deal.map((m,i)=>cardHTML(i,m)).join('');
    ctx.buttons(''); ctx.hint('섞는 중이에요...');
    const sr=stage.getBoundingClientRect(), cx=sr.left+sr.width/2, cy=sr.top+sr.height/2;
    stage.querySelectorAll('.card').forEach(c=>{
      const r=c.getBoundingClientRect();
      c.style.setProperty('--dx',(cx-(r.left+r.width/2))+'px');
      c.style.setProperty('--dy',(cy-(r.top+r.height/2))+'px');
      c.style.setProperty('--rot',(rnd(40)-20)+'deg');
      c.classList.add('moving');
    });
    playSound('shuffle');
    setTimeout(()=>{
      if(!ctx.alive()) return;
      let rank=0; const order=[];
      const cards=[...stage.querySelectorAll('.card')];
      ctx.hint(mode==='order'?'한 장씩 뒤집어보세요! 먼저 나온 사람이 1번째예요':'한 장 골라주세요!');
      cards.forEach(c=>{
        c.classList.remove('moving'); c.classList.add('pickable');
        c.setAttribute('role','button'); c.setAttribute('tabindex','0');
        const pick=()=>{
          if(!ctx.alive() || c.classList.contains('flipped')) return;
          const m=deal[+c.dataset.i];
          c.classList.remove('pickable'); c.classList.add('flipped'); c.removeAttribute('tabindex');
          playSound('flip');
          if(mode==='order'){
            rank++; order.push(m);
            c.querySelector('.rk').textContent=rank+'번째';
            if(rank<n) ctx.hint(`${rank+1}번째는 누구일까요?`);
            else { ctx.hint(''); setTimeout(()=>ctx.done({order}),700); }
          }else{
            cards.forEach(o=>{ o.classList.remove('pickable'); o.onclick=null; });
            c.classList.add('win'); ctx.hint('');
            setTimeout(()=>{ if(!ctx.alive()) return; cards.forEach(o=>{ if(o!==c) o.classList.add('flipped','dim'); }); },900);
            setTimeout(()=>ctx.done({winner:m,others:deal}),600);
          }
        };
        c.onclick=pick; c.onkeydown=e=>{ if(e.key==='Enter') pick(); };
      });
    },1000);
  };
}

/* =========================================================
   🪜 사다리
   ========================================================= */
function gameLadder(ctx){
  const {mode}=ctx;
  const order=shuffle(ctx.list);         // 고르는 차례
  const n=order.length;
  const W=340,H=300,pad=30,y0=20,y1=H-20,L=8;
  const X=i=>n===1?W/2:pad+i*(W-2*pad)/(n-1);
  const step=(y1-y0)/L;

  // 가로선 만들기 (옆 칸과 붙지 않게)
  let rungs=[];
  for(let l=0;l<L;l++){ let prev=false; for(let c=0;c<n-1;c++){ if(!prev && rnd(100)<45){ rungs.push({c,l}); prev=true; } else prev=false; } }
  for(let c=0;c<n-1;c++){
    if(rungs.some(r=>r.c===c)) continue;
    const free=[...Array(L).keys()].filter(l=>!rungs.some(r=>r.l===l && Math.abs(r.c-c)===1));
    const l=free.length?free[rnd(free.length)]:rnd(L);
    rungs=rungs.filter(r=>!(r.l===l && Math.abs(r.c-c)<=1));
    rungs.push({c,l});
  }
  rungs.forEach(r=>{ r.y=y0+(r.l+.5)*step+(rnd(100)/100-.5)*step*.5; });
  rungs.sort((a,b)=>a.y-b.y);

  const labels = mode==='order' ? shuffle([...Array(n)].map((_,i)=>i+1)) : (()=>{ const a=Array(n).fill(0); a[rnd(n)]=1; return a; })();
  const labelText=v=> mode==='order' ? v : (v?'당첨':'통과');

  function pathOf(start){
    let col=start; const pts=[[X(col),0]];
    rungs.forEach(r=>{
      if(r.c===col){ pts.push([X(col),r.y],[X(col+1),r.y]); col++; }
      else if(r.c===col-1){ pts.push([X(col),r.y],[X(col-1),r.y]); col--; }
    });
    pts.push([X(col),H]);
    return {pts,end:col};
  }

  const pct=i=>(X(i)/W*100)+'%';
  const lane=new Array(n).fill(null);    // 줄마다 누가 섰는지
  let picking=0;                          // 지금 고를 사람 번호

  $('gameArea').innerHTML=`
    <div class="ladder">
      <div class="l-row l-top" id="lTop"></div>
      <svg viewBox="0 0 ${W} ${H}" aria-hidden="true">
        <defs>
          <pattern id="stripe" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
            <rect width="18" height="18" fill="#F4F7F3"/><rect width="9" height="18" fill="#E3EDE4"/>
          </pattern>
        </defs>
        <g stroke="#AFBDB2" stroke-width="4" stroke-linecap="round">
          ${rungs.map(r=>`<line x1="${X(r.c)}" y1="${r.y}" x2="${X(r.c+1)}" y2="${r.y}"/>`).join('')}
        </g>
        <rect class="l-cover" id="lCover" x="${pad-16}" y="${y0-6}" width="${W-2*pad+32}" height="${y1-y0+12}" rx="18" fill="url(#stripe)"/>
        <g stroke="#C4CEC6" stroke-width="4" stroke-linecap="round">
          ${[...Array(n)].map((_,i)=>`<line x1="${X(i)}" y1="0" x2="${X(i)}" y2="${H}"/>`).join('')}
        </g>
        <g id="lPaths"></g>
      </svg>
      <div class="l-row l-bot">${labels.map((_,i)=>`<div class="lb" data-c="${i}" style="left:${pct(i)}">?</div>`).join('')}</div>
    </div>`;

  /* ---- 1단계: 줄 고르기 ---- */
  function paintPick(){
    $('lTop').innerHTML=lane.map((m,i)=>{
      if(m) return `<div class="lt" style="left:${pct(i)}">${avatar(m,n>6?30:36)}<span class="n">${esc(m.name)}</span></div>`;
      return `<button class="lt empty" data-pick="${i}" style="left:${pct(i)}"><span class="slot">${i+1}</span><span class="n">빈 줄</span></button>`;
    }).join('');
    $('lTop').querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>choose(+b.dataset.pick));
    const who=order[picking];
    ctx.hint(`${who.name}님, 어느 줄에 설까요?`);
  }
  function choose(i){
    if(!ctx.alive() || lane[i]) return;
    lane[i]=order[picking]; picking++; playSound('pop');
    if(picking<n){ paintPick(); return; }
    startRun();
  }
  function autoFill(){
    const empty=[...Array(n).keys()].filter(i=>!lane[i]);
    shuffle(empty).forEach(i=>{ if(picking<n){ lane[i]=order[picking]; picking++; } });
    startRun();
  }
  paintPick();
  ctx.buttons(`<button class="jelly plain full" id="btnAuto">남은 줄 자동으로 정하기</button>`);
  $('btnAuto').onclick=autoFill;

  /* ---- 2단계: 내려가기 ---- */
  const results=new Array(n).fill(null);
  let doneCount=0;
  function startRun(){
    if(!ctx.alive()) return;
    $('lTop').innerHTML=lane.map((m,i)=>`<button class="lt" data-i="${i}" style="left:${pct(i)}">${avatar(m,n>6?30:36)}<span class="n">${esc(m.name)}</span></button>`).join('');
    $('lTop').querySelectorAll('.lt').forEach(b=>b.onclick=()=>run(+b.dataset.i));
    ctx.hint('누구부터 내려가 볼까요? 캐릭터를 눌러주세요!');
    ctx.buttons(`<button class="jelly mint full" id="btnAll">한 번에 다 보기</button>`);
    $('btnAll').onclick=()=>{ $('btnAll').disabled=true; lane.forEach((_,i)=>setTimeout(()=>run(i), i*260)); };
  }
  function run(i){
    if(!ctx.alive() || results[i]!==null) return;
    results[i]='running';
    const btn=$('gameArea').querySelector(`.lt[data-i="${i}"]`);
    if(btn) btn.classList.add('go');
    const {pts,end}=pathOf(i);
    let len=0; for(let k=1;k<pts.length;k++) len+=Math.hypot(pts[k][0]-pts[k-1][0],pts[k][1]-pts[k-1][1]);
    const d=pts.map(p=>p.join(',')).join(' ');
    const dur=Math.min(2.4,.9+len/420);
    const g=$('lPaths');
    g.insertAdjacentHTML('beforeend',`
      <polyline class="l-path" points="${d}" stroke="#fff" stroke-width="11" style="stroke-dasharray:${len};stroke-dashoffset:${len};transition:stroke-dashoffset ${dur}s linear"/>
      <polyline class="l-path" points="${d}" stroke="${darken(lane[i].color)}" stroke-width="6" style="stroke-dasharray:${len};stroke-dashoffset:${len};transition:stroke-dashoffset ${dur}s linear"/>`);
    const lines=[...g.querySelectorAll('polyline')].slice(-2);
    requestAnimationFrame(()=>requestAnimationFrame(()=>lines.forEach(p=>p.style.strokeDashoffset=0)));
    playSound('ladder',dur);
    setTimeout(()=>{
      if(!ctx.alive()) return;
      if(btn){ btn.classList.remove('go'); btn.classList.add('done'); }
      const lb=$('gameArea').querySelector(`.lb[data-c="${end}"]`);
      lb.textContent=labelText(labels[end]); lb.classList.add('open');
      if(mode!=='order' && labels[end]) lb.classList.add('win');
      if(mode==='order' && labels[end]===1) lb.classList.add('win');
      playSound(mode!=='order'&&labels[end]?'flip':'pop');
      results[i]=labels[end]; doneCount++;
      if(doneCount===n) allDone();
    }, dur*1000+60);
  }
  function allDone(){
    ctx.buttons(''); ctx.hint('');
    $('lCover').style.opacity=0;
    setTimeout(()=>{
      if(!ctx.alive()) return;
      if(mode==='order'){
        const res=lane.map((m,i)=>({m,v:results[i]})).sort((a,b)=>a.v-b.v).map(o=>o.m);
        ctx.done({order:res});
      }else ctx.done({winner:lane[results.findIndex(v=>v===1)],others:lane});
    },900);
  }
}
function darken(hex){
  const n=parseInt(hex.slice(1),16);
  const f=v=>Math.max(0,Math.round(v*.72)).toString(16).padStart(2,'0');
  return '#'+f(n>>16&255)+f(n>>8&255)+f(n&255);
}

/* =========================================================
   🎡 돌림판
   ========================================================= */
function wheelSVG(list,size=300){
  const c=size/2, r=size/2-14, n=list.length, s=360/n;
  const P=(a,rad)=>[c+rad*Math.sin(a*Math.PI/180), c-rad*Math.cos(a*Math.PI/180)];
  let out=`<svg viewBox="0 0 ${size} ${size}"><circle cx="${c}" cy="${c}" r="${c-2}" fill="#34465A"/><circle cx="${c}" cy="${c}" r="${c-13}" fill="#fff"/>`;
  list.forEach((m,i)=>{
    const a0=i*s, a1=(i+1)*s, [x0,y0]=P(a0,r), [x1,y1]=P(a1,r);
    const col=n>1&&i>0&&list[i-1].color===m.color?shade(m.color):m.color;
    out+= n===1 ? `<circle cx="${c}" cy="${c}" r="${r}" fill="${m.color}"/>`
      : `<path d="M${c},${c} L${x0},${y0} A${r},${r} 0 ${s>180?1:0} 1 ${x1},${y1} Z" fill="${col}" stroke="#fff" stroke-width="3"/>`;
    const mid=a0+s/2, fs=n<=4?34:n<=6?28:22, nlen=[...(m.name||"")].length, nfs=(n<=4?15:n<=6?13:11)*Math.min(1,4/Math.max(4,nlen));
    out+=`<g transform="rotate(${mid} ${c} ${c})">
      <text x="${c}" y="${c-r*.66}" text-anchor="middle" dominant-baseline="middle" font-size="${fs}" font-family="Jua" fill="#34465A">${faceOf(m)}</text>
      <text x="${c}" y="${c-r*.40}" text-anchor="middle" dominant-baseline="middle" font-size="${nfs.toFixed(1)}" font-family="Jua" fill="#34465A">${esc(m.name)}</text></g>`;
  });
  const B=18;
  for(let k=0;k<B;k++){ const [bx,by]=P(k*360/B+10,c-7.5); out+=`<circle class="bulb ${k%2?'alt':''}" cx="${bx}" cy="${by}" r="3.6"/>`; }
  return out+`</svg>`;
}
function shade(hex){
  const n=parseInt(hex.slice(1),16);
  const f=v=>Math.min(255,Math.round(v+(255-v)*.45)).toString(16).padStart(2,'0');
  return '#'+f(n>>16&255)+f(n>>8&255)+f(n&255);
}
function gameWheel(ctx){
  const {mode}=ctx;
  let remaining=shuffle(ctx.list);
  const order=[];
  let rot=0, spinning=false;
  $('gameArea').innerHTML=`
    <div class="wheel-wrap" id="wWrap">
      <svg class="pointer" id="wPtr" viewBox="0 0 44 50"><path d="M22 48 L6 16 A17 17 0 1 1 38 16 Z" fill="#34465A" stroke="#fff" stroke-width="3"/><circle cx="22" cy="16" r="5" fill="#fff"/></svg>
      <div class="wheel" id="wheel"></div>
      <div class="hub" id="hub">휙<br><small>돌려요</small></div>
    </div>
    <div class="ranks-mini" id="ranksMini"></div>`;
  const draw=()=>{
    const w=$('wheel');
    w.classList.add('no-anim'); w.style.transform='rotate(0deg)'; rot=0;
    w.innerHTML=wheelSVG(remaining);
    void w.offsetWidth; w.classList.remove('no-anim');
  };
  draw();
  ctx.hint(mode==='order'?'손가락으로 휙 돌려서 1번째를 정해요!':'손가락으로 판을 휙 돌려주세요!');
  ctx.buttons(`<button class="jelly plain full" id="btnSpinBtn">버튼으로 돌리기</button>`);
  $('btnSpinBtn').onclick=()=>spin(900+rnd(700));

  /* ---- 손가락으로 돌리기 ---- */
  const wrap=$('wWrap');
  let drag=null;
  const angleAt=e=>{
    const r=wrap.getBoundingClientRect();
    return Math.atan2(e.clientY-(r.top+r.height/2), e.clientX-(r.left+r.width/2))*180/Math.PI;
  };
  wrap.addEventListener('pointerdown',e=>{
    if(spinning || !ctx.alive()) return;
    const a=angleAt(e);
    drag={total:0, last:a, log:[{a:0,t:performance.now()}]};
    wrap.setPointerCapture(e.pointerId);
    wrap.classList.add('grab');
  });
  wrap.addEventListener('pointermove',e=>{
    if(!drag) return;
    let a=angleAt(e), d=a-drag.last;
    if(d>180) d-=360; if(d<-180) d+=360;
    drag.total+=d; drag.last=a;
    // 마지막 순간의 속도만 보려고 기록해 둬요
    drag.log.push({a:drag.total, t:performance.now()});
    if(drag.log.length>24) drag.log.shift();
    $('wheel').classList.add('no-anim');
    $('wheel').style.transform=`rotate(${rot+drag.total}deg)`;
  });
  const release=()=>{
    if(!drag) return;
    const log=drag.log, last=log[log.length-1];
    // 놓기 직전 120ms 동안 얼마나 움직였나 (손은 끝에서 제일 빨라요)
    let first=log[0];
    for(let i=log.length-1;i>=0;i--){ first=log[i]; if(last.t-log[i].t>=120) break; }
    const ms=Math.max(30,last.t-first.t);
    const speed=Math.abs(last.a-first.a)/ms*1000;    // 초당 각도
    rot+=drag.total;
    drag=null;
    wrap.classList.remove('grab');
    $('wheel').classList.remove('no-anim');
    if(speed<70){ ctx.hint('조금 더 세게 돌려주세요!'); return; }
    spin(speed);
  };
  wrap.addEventListener('pointerup',release);
  wrap.addEventListener('pointercancel',release);

  function spin(speed){
    if(spinning || !ctx.alive()) return;
    spinning=true; $('hub').classList.add('off');
    const n=remaining.length, s=360/n;
    const idx=rnd(n);                               // 결과는 완전 랜덤!
    const a=idx*s + s*(.18+rnd(64)/100);
    // 민 세기에 따라 바퀴 수가 확 달라져요 (살살 1바퀴 ~ 세게 14바퀴)
    const turns=Math.max(1, Math.min(14, Math.round(speed/170)));
    const dur=Math.min(7, 1.1+turns*0.42);
    ctx.hint(turns>=9?'우와, 엄청 세게 돌렸어요!':turns<=2?'살살 돌았어요...':'빙글빙글 도는 중이에요...');
    const want=(360-a%360)%360;
    rot += 360*turns + ((want-(((rot%360)+360)%360))+360)%360;
    $('wheel').style.transition=`transform ${dur}s cubic-bezier(.12,.62,.08,1)`;
    $('wWrap').classList.add('spinning');
    $('wheel').style.transform=`rotate(${rot}deg)`;
    tickSounds(dur);
    setTimeout(()=>{
      if(!ctx.alive()) return;
      $('wWrap').classList.remove('spinning'); $('hub').classList.remove('off');
      const m=remaining[idx];
      spinning=false;
      if(mode!=='order'){ ctx.hint(''); ctx.done({winner:m,others:ctx.list}); return; }
      order.push(m); remaining.splice(idx,1);
      playSound('pop');
      const add=(mm,k)=>$('ranksMini').insertAdjacentHTML('beforeend',`<span>${avatar(mm,26)}${k}. ${esc(mm.name)}</span>`);
      add(m,order.length);
      if(remaining.length===1){
        order.push(remaining[0]); add(remaining[0],order.length);
        ctx.hint(''); setTimeout(()=>ctx.done({order}),700);
        return;
      }
      ctx.hint(`${order.length}번째는 ${esc(m.name)}! 한 번 더 돌려주세요`);
      setTimeout(()=>{ if(!ctx.alive()) return; draw(); },900);
    },dur*1000+120);
  }
  function tickSounds(dur){
    let t=0, gap=70;
    while(t<dur*1000-300){ const tt=t; setTimeout(()=>{ if(!ctx.alive())return; playSound('tick'); const p=$('wPtr'); if(p){ p.classList.remove('tick'); void p.offsetWidth; p.classList.add('tick'); } },tt); t+=gap; gap*=1.10; }
  }
}

/* =========================================================
   💣 지뢰 상자
   ========================================================= */
function gameBomb(ctx){
  const {mode}=ctx;
  const players=shuffle(ctx.list);
  const n=players.length;
  const side = n<=4?4 : n<=7?5 : 6;
  const total=side*side;

  // 한 명 뽑기: 폭탄 1개. 순서 정하기: 1~n 번호표를 숨김
  const cells=new Array(total).fill(0);   // 0 = 꽝
  if(mode==='order'){
    shuffle([...Array(total).keys()]).slice(0,n).forEach((c,i)=>cells[c]=i+1);
  }else{
    cells[rnd(total)]='boom';
  }

  let turn=0;                              // 지금 누구 차례
  const got={};                            // 순서 모드: 뽑은 번호
  const left=()=>players.filter(p=>!(p.id in got));

  $('gameArea').innerHTML=`
    <div class="mine-wrap">
      <div class="mine-turn" id="mTurn"></div>
      <div class="mine-grid" id="mGrid" style="grid-template-columns:repeat(${side},1fr)">
        ${cells.map((_,i)=>`<button class="box" data-c="${i}">📦</button>`).join('')}
      </div>
      <div class="mine-bar" id="mBar"></div>
      <div class="mine-info" id="mInfo"></div>
    </div>`;

  function now(){ const L=mode==='order'?left():players; return L.length?L[turn%L.length]:players[0]; }
  function paint(){
    const p=now();
    $('mTurn').innerHTML=`<span class="who">${avatar(p,34)}<span>${esc(p.name)}</span></span> 차례!`;
    $('mBar').innerHTML=players.map(m=>{
      const g=got[m.id];
      return `<span class="${g?'out':''}">${avatar(m,22)}<b>${esc(m.name)}${g?` ${g}번째`:''}</b></span>`;
    }).join('');
    const opened=$('gameArea').querySelectorAll('.box.open,.box.boom').length;
    $('mInfo').textContent = mode==='order'
      ? `남은 번호표 ${left().length}개, 안 연 상자 ${total-opened}개예요`
      : `안 연 상자 ${total-opened}개 중에 폭탄이 1개 있어요`;
  }
  const lockAll=()=>$('mGrid').querySelectorAll('.box').forEach(o=>{ o.disabled=true; o.onclick=null; });
  ctx.hint(mode==='order'?'상자를 열어 번호표를 찾아볼까요?':'폰을 넘겨가며 상자를 하나씩 열어볼까요?');
  ctx.buttons('');
  paint();

  $('mGrid').querySelectorAll('.box').forEach(b=>b.onclick=()=>{
    if(!ctx.alive()) return;
    const i=+b.dataset.c, v=cells[i], p=now();
    b.disabled=true;
    if(mode==='order'){
      if(v){
        got[p.id]=v; b.textContent=v+'번째'; b.classList.add('open','num'); playSound('flip');
        if(left().length===0){ lockAll(); ctx.hint(''); setTimeout(()=>ctx.done({order:players.slice().sort((a,c)=>got[a.id]-got[c.id])}),700); return; }
      }else{
        b.textContent=''; b.classList.add('open'); playSound('pop');
      }
      turn++; paint();
      return;
    }
    if(v==='boom'){
      b.textContent='💥'; b.classList.add('boom'); playSound('boom');
      lockAll();
      ctx.hint(''); setTimeout(()=>ctx.done({winner:p,others:players}),900);
      return;
    }
    b.textContent=''; b.classList.add('open'); playSound('pop');
    const rest=total-$('gameArea').querySelectorAll('.box.open,.box.boom').length;
    if(rest===1) toast(`😱 ${esc(p.name)}님, 마지막 한 칸만 남았어요!`);
    else if(rest<=3) toast(`😮‍💨 휴! ${rest}칸 남았는데 피했어요`);
    else if(rest<=6) toast(`😬 ${rest}칸 남았어요. 조심조심!`);
    turn++; paint();
  });
}

/* =========================================================
   🎈 풍선 불기
   ========================================================= */
function gameBalloon(ctx){
  const {mode}=ctx;
  let players=shuffle(ctx.list);
  const ranks=[];            // 순서 모드: 터뜨린 사람부터 뒤에서 채워요
  let turn=0, size=0, burst=0, holding=false, raf=null, held=0, over=false;
  const MIN_HOLD=0.35;       // 이만큼은 꼭 불어야 넘길 수 있어요
  const GROW=17;             // 1초에 커지는 정도

  $('gameArea').innerHTML=`
    <div class="bal-wrap">
      <div class="bal-turn" id="bTurn"></div>
      <div class="bal-stage"><svg class="bal" id="bal" width="175" height="210" viewBox="0 0 200 240"></svg></div>
      <div class="bal-queue" id="bQueue"></div>
    </div>`;

  function newBalloon(){
    size=0; burst=18+rnd(83);       // 언제 터질지는 비밀!
    draw();
  }
  function who(){ return players[turn % players.length]; }
  function draw(){
    const m=who(), s=(0.55+size/100*0.70).toFixed(3);
    const el=$('bal');
    el.style.setProperty('--s',s);
    el.style.transform=`scale(${s})`;
    el.innerHTML=`
      <path d="M100 210 q-6 -12 0 -24 q6 12 0 24" fill="${darken(m.color)}"/>
      <path d="M100 212 q14 16 2 30 q-12 14 4 26" stroke="${darken(m.color)}" stroke-width="3" fill="none" stroke-linecap="round"/>
      <ellipse cx="100" cy="115" rx="78" ry="95" fill="${m.color}"/>
      <ellipse cx="72" cy="80" rx="20" ry="30" fill="#fff" opacity=".45"/>`;
  }
  function paint(){
    const m=who();
    $('bTurn').innerHTML=`<span class="who">${avatar(m,32)}<span>${esc(m.name)}</span></span> 차례예요!`;
    $('bQueue').innerHTML=players.map((p,i)=>`<span class="${i===turn%players.length?'now':''}">${avatar(p,20)}${esc(p.name)}</span>`).join('');
  }
  function tick(t){
    if(!holding) return;
    const dt=(t-last)/1000; last=t;
    held+=dt; size+=dt*GROW;
    draw();
    if(size>=burst){ pop(); return; }
    raf=requestAnimationFrame(tick);
  }
  let last=0;
  function start(e){
    if(over || holding) return;
    e.preventDefault();
    holding=true; held=0; last=performance.now();
    $('bBtn').classList.add('holding'); $('bal').classList.add('holding');
    ctx.hint('후~ 불고 있어요...');
    playSound('blow');
    raf=requestAnimationFrame(tick);
  }
  function stop(){
    if(!holding) return;
    holding=false; cancelAnimationFrame(raf);
    $('bBtn').classList.remove('holding'); $('bal').classList.remove('holding');
    if(over) return;
    if(held<MIN_HOLD){ ctx.hint('조금 더 불어주세요!'); return; }
    turn++; paint();
    ctx.hint('다음 사람에게 폰을 넘겨주세요!');
    playSound('pop');
  }
  function pop(){
    holding=false; cancelAnimationFrame(raf);
    const m=who();
    $('bal').classList.remove('holding'); $('bal').classList.add('pop');
    $('bBtn').classList.remove('holding');
    playSound('boom');
    ctx.hint('');
    if(mode!=='order'){
      over=true;
      setTimeout(()=>ctx.done({winner:m,others:ctx.list}),900);
      return;
    }
    ranks.unshift(m);                        // 먼저 터뜨릴수록 뒷번호
    players=players.filter(p=>p.id!==m.id);
    if(players.length<=1){
      over=true;
      if(players.length===1) ranks.unshift(players[0]);
      setTimeout(()=>ctx.done({order:ranks}),900);
      return;
    }
    ctx.hint(`${m.name}님이 터뜨렸어요! 남은 사람끼리 계속해요`);
    setTimeout(()=>{
      if(!ctx.alive()) return;
      $('bal').classList.remove('pop');
      turn=0; newBalloon(); paint();
      ctx.hint('새 풍선이에요. 꾹 눌러서 불어주세요!');
    },1400);
  }

  ctx.hint('버튼을 꾹 누르면 풍선이 커져요!');
  ctx.buttons(`<button class="jelly big bal-btn" id="bBtn">🎈 꾹 눌러서 불기</button>`);
  const btn=$('bBtn');
  btn.addEventListener('pointerdown',start);
  btn.addEventListener('pointerup',stop);
  btn.addEventListener('pointercancel',stop);
  btn.addEventListener('pointerleave',stop);
  newBalloon(); paint();
}

/* ---------- 파티 효과 ---------- */
function confetti(main){
  const cols=[main,'#9CC7EA','#F6C7AE','#EFD9A0','#AFCBB3','#34465A'];
  for(let k=0;k<54;k++){
    const p=document.createElement('div');
    p.className='confetti '+(k%3===0?'dot':'bit');
    p.style.background=cols[rnd(cols.length)];
    p.style.left=rnd(100)+'vw';
    p.style.setProperty('--x',(rnd(140)-70)+'px');
    p.style.setProperty('--r',(rnd(720)-360)+'deg');
    p.style.animationDuration=(1.8+rnd(16)/10)+'s';
    p.style.animationDelay=(rnd(40)/100)+'s';
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),4200);
  }
}

/* ---------- 효과음 ---------- */
let AC=null, SFX=null;
const SFX_LEVEL=0.45;            // 효과음 전체 크기 (1이 예전 크기)
// 소리 모드: 'all' 전부 / 'sfx' 효과음만 / 'none' 전부 끔
let SOUND = LS.get('turn_sound') || (LS.get('turn_bgm')===false ? 'sfx' : 'all');
function sfxOut(){
  if(!SFX){
    SFX=AC.createGain(); SFX.gain.value=SFX_LEVEL;
    const lp=AC.createBiquadFilter();       // 귀 아픈 높은 소리를 깎아요
    lp.type='lowpass'; lp.frequency.value=3200;
    SFX.connect(lp).connect(AC.destination);
  }
  return SFX;
}
function playSound(type,dur=1){
  if(SOUND==='none') return;
  try{
    if(typeof BGM!=='undefined') BGM.duck();
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume();
    const now=AC.currentTime;
    const tone=(f,t,d,vol=.09,wave='sine')=>{
      const o=AC.createOscillator(),g=AC.createGain();
      o.type=wave; o.frequency.value=f;
      g.gain.setValueAtTime(0,now+t); g.gain.linearRampToValueAtTime(vol,now+t+.01);
      g.gain.exponentialRampToValueAtTime(.0001,now+t+d);
      o.connect(g).connect(sfxOut()); o.start(now+t); o.stop(now+t+d+.05);
    };
    if(type==='shuffle') for(let i=0;i<6;i++) tone(440+rnd(300),i*.11,.05,.035,'triangle');
    if(type==='flip'){ tone(660,0,.12,.055,'triangle'); tone(880,.06,.14,.035,'sine'); }
    if(type==='pop') tone(740,0,.11,.05,'sine');
    if(type==='tick') tone(1100,0,.025,.018,'triangle');
    if(type==='ladder'){ const k=Math.floor(dur*5); for(let i=0;i<k;i++) tone(480+i*32,i/5,.06,.025,'triangle'); }
    if(type==='boom'){ const o=AC.createOscillator(),g=AC.createGain(); o.type='sawtooth'; o.frequency.setValueAtTime(260,now); o.frequency.exponentialRampToValueAtTime(40,now+.5); g.gain.setValueAtTime(.09,now); g.gain.exponentialRampToValueAtTime(.0001,now+.55); o.connect(g).connect(sfxOut()); o.start(now); o.stop(now+.6); }
    if(type==='blow'){
      const bufSize=AC.sampleRate*0.5, buf=AC.createBuffer(1,bufSize,AC.sampleRate), d=buf.getChannelData(0);
      for(let i=0;i<bufSize;i++) d[i]=(Math.random()*2-1)*0.5;
      const src=AC.createBufferSource(); src.buffer=buf; src.loop=true;
      const bp=AC.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=780; bp.Q.value=0.8;
      const g=AC.createGain(); g.gain.setValueAtTime(0,now); g.gain.linearRampToValueAtTime(.08,now+.15);
      g.gain.setValueAtTime(.08,now+.4); g.gain.exponentialRampToValueAtTime(.0001,now+.75);
      src.connect(bp).connect(g).connect(sfxOut()); src.start(now); src.stop(now+.8);
    }
    if(type==='oops'){
      // 뿌우~ 아쉬운 소리
      const o=AC.createOscillator(), g=AC.createGain();
      o.type='sawtooth';
      o.frequency.setValueAtTime(392,now);
      o.frequency.linearRampToValueAtTime(330,now+.28);
      o.frequency.linearRampToValueAtTime(247,now+.62);
      g.gain.setValueAtTime(.001,now); g.gain.linearRampToValueAtTime(.055,now+.06);
      g.gain.setValueAtTime(.055,now+.5); g.gain.exponentialRampToValueAtTime(.0001,now+.85);
      o.connect(g).connect(sfxOut()); o.start(now); o.stop(now+.9);
      tone(196,.62,.35,.045,'triangle');
      tone(98,.62,.45,.04,'sine');
    }
    if(type==='party'){
      [523,659,784,1047].forEach((f,i)=>tone(f,i*.12,.32,.055,'triangle'));
      [1047,1319].forEach((f,i)=>tone(f,.58+i*.09,.28,.022,'sine'));
    }
  }catch(e){}
}

/* =========================================================
   🎵 배경음악 (앱이 직접 만드는 소리)
   ========================================================= */
const N={C3:130.81,D3:146.83,E3:164.81,F3:174.61,G3:196.00,A3:220.00,
         C4:261.63,D4:293.66,E4:329.63,F4:349.23,G4:392.00,A4:440.00,
         C5:523.25,D5:587.33,E5:659.25,G5:783.99,A5:880.00};
const BGM = {
  get on(){ return SOUND==='all'; },
  step:0, next:0, timer:null, gain:null, started:false, duckUntil:0,
  beat:0.42,                       // 한 박 길이(초) — 느긋하게
  // 4마디가 한 바퀴: 도 - 라단 - 파 - 솔
  chords:[[N.C3,N.E4,N.G4],[N.A3,N.C4,N.E4],[N.F3,N.A3,N.C4],[N.G3,N.D4,N.G4]],
  // 마디마다 다른 가락 (0은 쉼표) — 같은 게 반복되지 않아요
  phrases:[
    [N.G4,0,N.E4,N.C5,0,N.A4,0,0],
    [N.A4,0,N.G4,0,N.E4,0,N.D4,0],
    [N.C5,N.A4,0,N.G4,0,N.E4,0,0],
    [N.D5,0,N.C5,N.A4,0,N.G4,0,0],
    [0,N.E4,N.G4,0,N.A4,0,N.C5,0],
    [N.E5,0,N.D5,0,N.C5,N.A4,0,0],
  ],
  order:[0,1,2,3], bar:0,

  ensure(){
    if(!AC) return false;
    if(!this.gain){
      this.gain=AC.createGain(); this.gain.gain.value=0;
      const lp=AC.createBiquadFilter();        // 높은 소리를 깎아 부드럽게
      lp.type='lowpass'; lp.frequency.value=2400;
      this.gain.connect(lp).connect(AC.destination);
    }
    return true;
  },
  note(f,t,dur,vol,wave='sine'){
    const o=AC.createOscillator(), g=AC.createGain();
    o.type=wave; o.frequency.value=f;
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(vol,t+.08);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g).connect(this.gain); o.start(t); o.stop(t+dur+.05);
  },
  tick(){
    if(!AC) return;
    while(this.next < AC.currentTime + 0.4){
      const t=Math.max(this.next, AC.currentTime+0.02);
      const st=this.step % 8;                       // 한 마디 = 8칸
      if(st===0){
        this.bar=(this.bar+1)%4;
        if(this.bar===0) this.order=shuffle([0,1,2,3,4,5]).slice(0,4);
        const ch=this.chords[this.bar];
        this.note(ch[0],t,this.beat*3.4,.05);                    // 낮은 베이스
        this.note(ch[1],t+.09,this.beat*2.6,.022,'triangle');    // 화음
        this.note(ch[2],t+.18,this.beat*2.4,.018,'triangle');
      }
      const ph=this.phrases[this.order[this.bar]];
      const m=ph[st];
      if(m) this.note(m,t,this.beat*1.5,.035,'triangle');
      this.step++; this.next = t + this.beat/2;
    }
  },
  level(){ return AC && AC.currentTime < this.duckUntil ? .3 : 1; },
  // 게임 소리가 날 때 잠깐 작아져요
  duck(){
    if(!this.timer || !this.gain || !AC) return;
    const t=AC.currentTime;
    this.duckUntil=t+.6;
    this.gain.gain.cancelScheduledValues(t);
    this.gain.gain.setValueAtTime(this.gain.gain.value,t);
    this.gain.gain.linearRampToValueAtTime(.3,t+.08);
    this.gain.gain.linearRampToValueAtTime(1,t+.9);
  },
  start(){
    if(!this.on || this.timer) return;
    try{
      AC = AC || new (window.AudioContext||window.webkitAudioContext)();
      if(AC.state==='suspended') AC.resume();
    }catch(e){ return; }
    if(!this.ensure()) return;
    const t=AC.currentTime;
    this.gain.gain.cancelScheduledValues(t);
    this.gain.gain.setValueAtTime(0,t);
    this.gain.gain.linearRampToValueAtTime(1,t+2);
    this.next=t+0.1;
    this.timer=setInterval(()=>this.tick(),100);
    this.started=true;
  },
  stop(fade=true){
    if(this.timer){ clearInterval(this.timer); this.timer=null; }
    if(this.gain && AC){
      const t=AC.currentTime;
      this.gain.gain.cancelScheduledValues(t);
      this.gain.gain.setValueAtTime(this.gain.gain.value,t);
      this.gain.gain.linearRampToValueAtTime(0,t+(fade?.5:.02));
    }
  },
  toggle(){
    SOUND = SOUND==='all' ? 'sfx' : SOUND==='sfx' ? 'none' : 'all';
    LS.set('turn_sound',SOUND);
    if(SOUND==='all'){ this.start(); toast('🔊 소리를 전부 켰어요'); }
    else if(SOUND==='sfx'){ this.stop(); toast('🔉 배경음악만 껐어요'); }
    else{ this.stop(); toast('🔇 소리를 전부 껐어요'); }
    paintSnd();
  }
};
function paintSnd(){
  const ico={all:'🔊',sfx:'🔉',none:'🔇'}[SOUND];
  const lbl={all:'소리 전부 켜짐',sfx:'효과음만 켜짐',none:'소리 꺼짐'}[SOUND];
  document.querySelectorAll('[data-snd]').forEach(b=>{
    b.textContent=ico;
    b.classList.toggle('off', SOUND==='none');
    b.setAttribute('aria-label', lbl+' — 눌러서 바꾸기');
  });
}
document.querySelectorAll('[data-snd]').forEach(b=>b.onclick=()=>BGM.toggle());
paintSnd();
// 브라우저 규칙상 처음 화면을 한 번 눌러야 소리가 나요
document.addEventListener('pointerdown', function once(){
  document.removeEventListener('pointerdown', once);
  if(BGM.on) setTimeout(()=>BGM.start(), 60);
}, {once:true});
// 다른 앱으로 나가면 잠깐 멈춰요
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden) BGM.stop(false);
  else if(BGM.on && BGM.started) BGM.start();
});

/* ---------- 처음 쓰는 사람 안내 ---------- */
const INTRO=[
  {e:'🎲', t:'누구 차례예요?', p:'리모컨, 앞자리, 마지막 과자.<br>말다툼 대신 게임으로 정해요.'},
  {e:'👨‍👩‍👧', t:'먼저 가족을 만들어요', p:'가족을 한 번만 등록해 두면<br>다음부터는 바로 쓸 수 있어요.'},
  {e:'🃏', t:'게임은 네 가지', p:'카드 뽑기, 사다리, 돌림판, 지뢰 상자.<br>한 명만 뽑거나 순서를 정할 수 있어요.'},
  {e:'📒', t:'기록이 남아요', p:'누가 몇 번 걸렸는지 모아 봐요.<br>이번 주 이야기도 알려드려요!'},
];
let introAt=0;
function paintIntro(){
  const s=INTRO[introAt];
  $('introBody').innerHTML=`<div class="big">${s.e}</div><h4>${s.t}</h4><p>${s.p}</p>`;
  $('introDots').innerHTML=INTRO.map((_,i)=>`<i class="${i===introAt?'on':''}"></i>`).join('');
  $('introNext').textContent = introAt===INTRO.length-1 ? '시작할래요' : '다음';
  $('introSkip').style.visibility = introAt===INTRO.length-1 ? 'hidden' : 'visible';
}
function closeIntro(){ $('mIntro').classList.remove('on'); LS.set('turn_intro',true); }
$('introNext').onclick=()=>{ if(introAt<INTRO.length-1){ introAt++; paintIntro(); } else closeIntro(); };
$('introSkip').onclick=closeIntro;
function maybeIntro(){
  if(LS.get('turn_intro')) return;
  introAt=0; paintIntro(); $('mIntro').classList.add('on');
}
